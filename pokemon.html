<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sijord · Pokémon explorer</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/src/client/assets/library.css"></head>
<body>
<header class="explorer-header"><a class="back" href="./">← Back to the game</a><div class="explorer-brand">SIJORD <span>Pokémon explorer</span></div><span id="coverage" class="coverage"></span></header>
<main class="explorer">
<aside class="collection"><div class="collection-top"><span class="eyebrow">THE COLLECTION</span><h1>Find your Pokémon</h1><label for="search" class="sr-only">Search Pokémon</label><input id="search" placeholder="Search name or Pokédex number…" type="search"><div class="filters"><select id="form" aria-label="Filter forms"><option value="all">All forms</option><option value="regular">Regular</option><option value="other">Alternate forms</option></select><label class="animated-filter"><input id="animated" type="checkbox"> Animated</label></div><p id="result-count"></p></div><div id="collection-grid" class="collection-grid"></div><button id="more" class="more">Show more</button><div class="jump"><label for="model">Jump to an entry</label><select id="model"></select></div></aside>
<section class="stage"><canvas id="viewer" aria-label="Interactive Pokémon model"></canvas><div class="stage-tip">Drag to rotate <span>·</span> Scroll to zoom</div><div id="loading" class="loading">Preparing the model…</div><div class="model-info"><span id="number" class="eyebrow"></span><h2 id="pokemon-name"></h2><p id="status" role="status"></p></div><div class="animation-bar"><div class="step-controls"><button id="previous" aria-label="Previous Pokémon">←</button><button id="next" aria-label="Next Pokémon">→</button></div><label for="animation">Animation<select id="animation"></select></label><button id="play" aria-label="Pause animation">Ⅱ</button><button id="reset">Reset view</button></div><div id="details" class="model-detail"></div></section>
</main><script type="module" src="/src/client/assets/library.ts"></script></body></html>
